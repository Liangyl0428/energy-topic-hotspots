[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-topic-hotspots"
version = "0.3.0"
description = "750-topic energy hotspot scoring and unified potential evidence replay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2", "pyarrow>=18,<26", "duckdb>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]
report = ["openpyxl>=3.1,<4", "matplotlib>=3.8,<4"]

[project.scripts]
energy-hotspots = "energy_hotspots.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
